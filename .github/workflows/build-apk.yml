name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Validate and Build Lakshay Library APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Locked Node Dependencies
        run: npm ci

      - name: TypeScript Validation
        run: npm run lint

      - name: Integrity and Failure-Injection Tests
        run: npm test

      - name: Build Web Bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      - name: Initialize Android via Capacitor
        run: |
          npx cap add android
          npx cap sync android
          node scripts/apply-android-icon.cjs
          grep -q 'versionCode 20009' android/app/build.gradle
          grep -q 'versionName "2.0.9"' android/app/build.gradle

      - name: Compile Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK and Generate SHA-256
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt" dump badging "$APK" | tee apk-metadata.txt
          grep -q "package: name='com.lakshaylibrary.app' versionCode='20009' versionName='2.0.9'" apk-metadata.txt

      - name: Upload Verified APK and Build Evidence
        uses: actions/upload-artifact@v4
        with:
          name: LakshayLibrary-v2.0.9-verified-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            apk-metadata.txt
